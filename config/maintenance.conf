# ================================================
# Server Maintenance Toolkit Configuration
# ================================================

# Backup Configuration
BACKUP_SOURCE="/home /etc"
BACKUP_DEST="/backup"
BACKUP_RETENTION_DAYS=7

# Disk Check Configuration
DISK_THRESHOLD=80
DISK_PARTITIONS="/ /home"

# Log Cleaner Configuration
LOG_DIRECTORIES="/var/log /tmp"
LOG_MAX_AGE_DAYS=30
LOG_MAX_SIZE_MB=100

# Email Alerts (optional - leave blank to disable)
ALERT_EMAIL="horlameday99@outlook.com"

# Logging
MAINTENANCE_LOG="/var/log/maintenance.log"
